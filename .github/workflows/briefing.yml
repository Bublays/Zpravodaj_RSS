name: Generate morning briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # 06:00 CET / 05:00 CEST bude potřeba sezonně upravit

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate:
    name: Generate preview
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Generate briefing HTML
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_briefing.py

      - name: Upload briefing preview
        uses: actions/upload-artifact@v4
        with:
          name: briefing-preview
          path: public/index.html

  publish:
    name: Publish to GitHub Pages
    needs: generate
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Download briefing preview
        uses: actions/download-artifact@v4
        with:
          name: briefing-preview
          path: public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
